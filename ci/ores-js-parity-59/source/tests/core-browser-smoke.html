<!doctype html>
<meta charset="utf-8">
<title>Oreslang freestanding core in browser</title>
<pre id="result">RUNNING</pre>
<script type="module">
import {compileProgramV2} from '../src/program-v2.mjs';
import {compileFreestandingCore} from '../src/freestanding-core.mjs';
import {compileLinkedFreestandingCore} from '../src/freestanding-core-link.mjs';
const display=document.querySelector('#result');
let url,linkedUrl,boolUrl,adtUrl,adtLinkedUrl,matchUrl,matchLinkedUrl,portableMatchUrl,conditionalUrl,namedUrl,symbolUrl,equalityUrl,classUrl;
try {
  const input=await fetch('./fixtures/freestanding-core-java.ores',{cache:'no-store'});
  if(!input.ok)throw Error('failed to load canonical core source');
  const coreSource=await input.text();
  const esm=compileFreestandingCore(coreSource);
  // ESM has no host imports. The Blob module is trusted test output only.
  url=URL.createObjectURL(new Blob([esm],{type:'text/javascript'}));
  const {core}=await import(url);
  const eq=(got,want,label)=>{if(got!==want)throw Error(label+': '+got);};
  eq(core.min_int(10n,20n),10n,'min');
  eq(core.max_int(-10n,-20n),-10n,'max');
  eq(core.clamp_int(20n,0n,10n),10n,'clamp');
  eq(core.clamp_int(9007199254740993n,9007199254740992n,9007199254740994n),9007199254740993n,'full-width int');
  if(Object.getPrototypeOf(core)!==null||!Object.isFrozen(core))throw Error('module isolation');
  const appFetch=await fetch('./fixtures/core-linked-app.ores',{cache:'no-store'});
  if(!appFetch.ok)throw Error('failed to load pure core app source');
  const linked=compileLinkedFreestandingCore({
    coreSource,appSource:await appFetch.text()
  });
  linkedUrl=URL.createObjectURL(new Blob([linked],{type:'text/javascript'}));
  const app=await import(linkedUrl);
  eq(app.sample(100n),10n,'linked core app high');
  eq(app.sample(-20n),0n,'linked core app low');
  eq(app.large(),9007199254740992n,'linked core app full-width');
  // Pure boolean core is also compiled and executed in this browser,
  // never by importing Node or hosted std into the guest ESM.
  const boolSourceFetch=await fetch('./fixtures/core-boolean.ores',{cache:'no-store'});
  if(!boolSourceFetch.ok)throw Error('failed to load pure boolean core source');
  const boolGenerated=compileFreestandingCore(await boolSourceFetch.text());
  boolUrl=URL.createObjectURL(new Blob([boolGenerated],{type:'text/javascript'}));
  const boolCore=(await import(boolUrl)).core;
  eq(boolCore.is_positive(1n),true,'bool positive');
  eq(boolCore.is_positive(-1n),false,'bool negative');
  eq(boolCore.invert(false),true,'bool negation');
  eq(boolCore.choose(true,42n,9n),42n,'bool typed condition');
  let boolRejected=false;
  try{boolCore.choose(1n,42n,9n);}catch(error){boolRejected=/bool required/.test(String(error));}
  if(!boolRejected)throw Error('browser must reject nonbool argument');
  const adtResponse=await fetch('./fixtures/core-option-result.ores',{cache:'no-store'});
  if(!adtResponse.ok)throw Error('cannot load portable ADT fixture');
  const adtSource=await adtResponse.text();
  const adtESM=compileFreestandingCore(adtSource);
  adtUrl=URL.createObjectURL(new Blob([adtESM],{type:'text/javascript'}));
  const adt=(await import(adtUrl)).core;
  const some=adt.positive(4n),none=adt.positive(-4n);
  eq(some.kind,'Some','ADT Some');
  eq(some.value,4n,'ADT Some payload');
  eq(none.kind,'None','ADT None');
  eq(adt.fallback(none,8n),8n,'ADT fallback');
  eq(adt.succeeded(adt.negative(-4n)),false,'ADT error');
  if(Object.getPrototypeOf(some)!==null||!Object.isFrozen(some))
    throw Error('ADT value shape must be immutable and null-prototype');
  let malformedRejected=false;
  try{adt.fallback({kind:'Some',value:4n},8n);}
  catch(error){malformedRejected=/tagged value/.test(String(error));}
  if(!malformedRejected)throw Error('ADT accepted malformed host object');
  const adtApp=await fetch('./fixtures/core-option-result-linked-app.ores',{cache:'no-store'});
  if(!adtApp.ok)throw Error('cannot load ADT linked app');
  const generated=compileLinkedFreestandingCore({coreSource:adtSource,appSource:await adtApp.text()});
  adtLinkedUrl=URL.createObjectURL(new Blob([generated],{type:'text/javascript'}));
  const adtLinked=await import(adtLinkedUrl);
  eq(adtLinked.positive_or_zero(-7n),0n,'linked ADT Option');
  eq(adtLinked.negative_is_error(-7n),true,'linked ADT Result');
  eq(adtLinked.checked_value(-7n),42n,'linked ADT fallback');
  const matchSourceResponse=await fetch('./fixtures/core-adt-match.ores',{cache:'no-store'});
  if(!matchSourceResponse.ok)throw Error('missing ADT match source');
  const matchSource=await matchSourceResponse.text();
  matchUrl=URL.createObjectURL(new Blob([compileFreestandingCore(matchSource)],{type:'text/javascript'}));
  const matcher=(await import(matchUrl)).core;
  eq(matcher.add_one(matcher.into_option(41n)),42n,'match Some capture');
  eq(matcher.add_one(matcher.into_option(-1n)),0n,'match None');
  eq(matcher.extract_result(matcher.into_result(-9n)),9n,'match Err capture');
  eq(matcher.nested(matcher.into_option(4n)),8n,'nested ADT capture');
  let matchRejected=false;
  try{matcher.add_one({kind:'Some',value:41n});}
  catch(error){matchRejected=/tagged value/.test(String(error));}
  if(!matchRejected)throw Error('ADT match accepted malformed JS object');
  const matchAppResp=await fetch('./fixtures/core-adt-match-linked-app.ores',{cache:'no-store'});
  if(!matchAppResp.ok)throw Error('missing ADT match application');
  matchLinkedUrl=URL.createObjectURL(new Blob([compileLinkedFreestandingCore({
    coreSource:matchSource,appSource:await matchAppResp.text()
  })],{type:'text/javascript'}));
  const matchedApp=await import(matchLinkedUrl);
  eq(matchedApp.sample(41n),42n,'linked Some pattern');
  eq(matchedApp.result(-9n),9n,'linked Err pattern');
  eq(matchedApp.nested(4n),8n,'linked nested ADT pattern');
  // Exact shared portable conformance vectors, including inert poison branches.
  const [portableSourceResponse,portableManifestResponse]=await Promise.all([
    fetch('./fixtures/conformance-option-result-match-i64-v0.ores',{cache:'no-store'}),
    fetch('./fixtures/conformance-option-result-match-i64-v0.json',{cache:'no-store'})
  ]);
  if(!portableSourceResponse.ok||!portableManifestResponse.ok)
    throw Error('missing pinned ADT conformance files');
  const portableManifest=await portableManifestResponse.json();
  if(portableManifest.schema!=='oreslang.portable-adt-match-i64.v0'||
     portableManifest.testVectors.length!==27)throw Error('wrong portable ADT contract');
  portableMatchUrl=URL.createObjectURL(new Blob([
    compileFreestandingCore(await portableSourceResponse.text())
  ],{type:'text/javascript'}));
  const portableCore=(await import(portableMatchUrl)).core;
  for(const vector of portableManifest.testVectors)
    eq(portableCore[vector.function](...vector.args.map(BigInt)),
      BigInt(vector.expected.int),'portable '+vector.id);
  if(portableManifest.negativeCases.length!==9)
    throw Error('incorrect portable ADT negative vector count');
  const rejectionPatterns={
    'missing-none':/non-exhaustive ADT match/,
    'duplicate-some':/duplicate match pattern Some/,
    'mixed-families':/cannot mix Option and Result variant patterns/,
    'wrong-subject':/parameter type mismatch/,
    'parameter-shadow':/ADT payload binding shadows an existing name/,
    'nested-shadow':/ADT payload binding shadows an existing name/,
    'none-has-no-payload':/None has no payload/,
    'wrong-return-type':/ADT int payload capture type mismatch/,
    'wildcard-instead-of-none':/ADT match requires exhaustive named variants/
  };
  for(const vector of portableManifest.negativeCases){
    const expected=rejectionPatterns[vector.id];
    if(!expected)throw Error('unknown portable negative '+vector.id);
    let rejected=false;
    try{compileFreestandingCore(vector.source);}
    catch(error){rejected=expected.test(String(error));}
    if(!rejected)throw Error('wrong browser diagnostic '+vector.id);
  }
  // Execute the new source conditional slice in a real browser engine.
  conditionalUrl=URL.createObjectURL(new Blob([compileProgramV2([
    'pub fnc choose(bool b): int {return b ? 42 : 1 % 0;}',
    'pub fnc nested(bool a,bool b): int {return a ? 1 : b ? 2 : 3;}',
    'pub fnc statement(bool b): int {if b then return 41; else return 42; fi}'
  ].join('\n'))],{type:'text/javascript'}));
  const conditionals=await import(conditionalUrl);
  eq(conditionals.choose(true),42n,'lazy ternary');
  let selectedFailure=false;
  try{conditionals.choose(false);}catch(error){selectedFailure=/ORES_I64_DIVISION_BY_ZERO/.test(String(error));}
  if(!selectedFailure)throw Error('selected ternary arm must preserve checked arithmetic');
  eq(conditionals.nested(false,true),2n,'right-associative ternary');
  eq(conditionals.nested(false,false),3n,'nested false arm');
  eq(conditionals.statement(false),42n,'canonical statement if');
  namedUrl=URL.createObjectURL(new Blob([compileProgramV2(
    'fnc take(int a,int b):int{return a+b;} pub fnc named():int{return take(b:2,a:40);}'
  )],{type:'text/javascript'}));
  eq((await import(namedUrl)).named(),42n,'named argument formal mapping');
  symbolUrl=URL.createObjectURL(new Blob([compileProgramV2(
    'pub fnc tag():Symbol{return #ready;} pub fnc echo(Symbol value):Symbol{return value;}'
  )],{type:'text/javascript'}));
  const symbols=await import(symbolUrl),tag=symbols.tag();
  eq(tag.name,'ready','nominal Symbol');
  eq(symbols.echo(tag),tag,'same-artifact Symbol parameter');
  if(!Object.isFrozen(tag)||Object.getPrototypeOf(tag)!==null)throw Error('Symbol shape');
  let forgedSymbolRejected=false;
  try{symbols.echo(Object.freeze(Object.assign(Object.create(null),{kind:'PROCESS',name:'ready'})));}
  catch(error){forgedSymbolRejected=/Oreslang Symbol required/.test(String(error));}
  if(!forgedSymbolRejected)throw Error('forged Symbol accepted');
  equalityUrl=URL.createObjectURL(new Blob([compileProgramV2(
    'pub fnc equal():bool{return #ready == #ready;} pub fnc unequal():bool{return #ready != #other;}'
  )],{type:'text/javascript'}));
  const equality=await import(equalityUrl);
  eq(equality.equal(),true,'logical Symbol equality');
  eq(equality.unequal(),true,'logical Symbol inequality');
  classUrl=URL.createObjectURL(new Blob([compileProgramV2(
    'pub define class Box as pub pick(self,int a,int b):int{return a*10+b;} end pub fnc run():int{return new Box().pick(b:2,a:4);}'
  )],{type:'text/javascript'}));
  const classes=await import(classUrl);
  eq(classes.run(),42n,'typed class named call');
  const box=new classes.Box();
  eq(box.pick(4n,2n),42n,'typed receiver call');
  let receiverRejected=false;
  try{classes.Box.prototype.pick.call({},4n,2n);}catch(error){receiverRejected=/invalid Oreslang receiver/.test(String(error));}
  if(!receiverRejected)throw Error('forged class receiver accepted');
  display.textContent='PASS_BROWSER_FREESTANDING_CORE';
} catch(error) {
  display.textContent='FAIL_BROWSER_FREESTANDING_CORE: '+String(error);
} finally {if(url)URL.revokeObjectURL(url);if(linkedUrl)URL.revokeObjectURL(linkedUrl);if(boolUrl)URL.revokeObjectURL(boolUrl);if(adtUrl)URL.revokeObjectURL(adtUrl);if(adtLinkedUrl)URL.revokeObjectURL(adtLinkedUrl);if(matchUrl)URL.revokeObjectURL(matchUrl);if(matchLinkedUrl)URL.revokeObjectURL(matchLinkedUrl);if(portableMatchUrl)URL.revokeObjectURL(portableMatchUrl);if(conditionalUrl)URL.revokeObjectURL(conditionalUrl);if(namedUrl)URL.revokeObjectURL(namedUrl);if(symbolUrl)URL.revokeObjectURL(symbolUrl);if(equalityUrl)URL.revokeObjectURL(equalityUrl);if(classUrl)URL.revokeObjectURL(classUrl);}
</script>
