name: JS compiler bootstrap tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fail closed on wrong source revision or modified checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git diff --quiet HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
          test -z "$(git ls-files --others --ignored --exclude-standard)"
          echo "Verified JS source commit: $EXPECTED_SOURCE_SHA"
          echo "Verified JS source tree: $(git rev-parse 'HEAD^{tree}')"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Execute checked-i64 guest differential suite
        run: node --test tests/checked-i64-arithmetic-differential.test.mjs tests/checked-i64-remainder-parity.test.mjs
      - name: Execute canonical conditional semantics and negative IR cases
        run: npm run test:conditionals
      - name: Execute composed conditional and ADT source-to-ESM checks
        run: npm run test:conditional-adt
      - name: Execute named-call binding and evaluation-order checks
        run: npm run test:named-args
      - name: Execute nominal Symbol literal and ABI checks
        run: npm run test:symbols
      - name: Execute Symbol equality and cross-artifact wire checks
        run: npm run test:symbol-wire
      - name: Execute unified program-v2 class and method checks
        run: npm run test:program-classes
      - name: Execute legacy class-method compatibility adapter checks
        run: npm run test:class-methods
      - run: npm test
      - run: npm run check
      - run: npm run parity:js
      - run: npm run parity:numeric-js
