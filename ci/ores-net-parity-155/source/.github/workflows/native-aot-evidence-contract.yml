name: Native AOT evidence contract self-test

on:
  pull_request:
    paths:
      - 'verification/ci-evidence-gate.mjs'
      - 'verification/ci-evidence-gate.test.mjs'
      - 'docs/CI_EVIDENCE_EXACT_HEAD.md'
      - '.github/workflows/native-aot-evidence-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify strict evidence parser negative fixtures
        run: node --test verification/ci-evidence-gate.test.mjs
