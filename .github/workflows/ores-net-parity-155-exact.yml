name: Ores .NET parity PR155 exact tree

on:
  push:
    branches:
      - ci/ores-net-parity-155-exact-20261026

permissions:
  contents: read

jobs:
  exact-tree-net:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact source tree
        shell: bash
        run: |
          set -euo pipefail
          expected='22a7cde2568a0339064bcf5711584f4e6b94c17a'
          actual="$(git rev-parse HEAD:ci/ores-net-parity-155/source)"
          test "$actual" = "$expected"
          echo "EXACT_SOURCE_TREE=$actual"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Managed parity and verifier suite
        working-directory: ci/ores-net-parity-155/source
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj -c Release
      - name: Build compiler
        working-directory: ci/ores-net-parity-155/source
        shell: bash
        run: |
          set -euo pipefail
          dotnet build compiler/Ores.Net.Compiler/Ores.Net.Compiler.csproj -c Release
      - name: Linux Native AOT compiler smoke
        working-directory: ci/ores-net-parity-155/source
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish compiler/Ores.Net.Compiler/Ores.Net.Compiler.csproj -c Release -r linux-x64 -o artifacts/compiler/linux-x64
          test -x artifacts/compiler/linux-x64/oresnet
          test ! -e artifacts/compiler/linux-x64/oresnet.runtimeconfig.json
          artifacts/compiler/linux-x64/oresnet check examples/hello.ores
          echo NET_NATIVE_AOT_PARITY_EXECUTED
